<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>积分商城 | 欧欧太空学习冒险</title><link rel="stylesheet" href="styles.css">
<style>
.balance{font-size:1.4em;color:#fbbf24;font-weight:700;margin:12px 0;text-align:center}
.gift-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0}
.gift-card{background:linear-gradient(135deg,#1a1f35,#151a2e);border:2px solid #2a3555;border-radius:16px;padding:20px;text-align:center;cursor:pointer;transition:all .3s}
.gift-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.3);border-color:#f59e0b}
.gift-card.insufficient{opacity:.5;cursor:not-allowed}
.gift-card.insufficient:hover{transform:none;box-shadow:none;border-color:#2a3555}
.gift-icon{font-size:3em;margin-bottom:10px}
.gift-name{font-size:1.1em;font-weight:700;margin-bottom:4px}
.gift-desc{color:#94a3b8;font-size:.82em;margin-bottom:8px}
.gift-price{color:#fbbf24;font-weight:700;font-size:1.1em}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.on{display:flex}
.modal-box{background:#1a1f35;border:1px solid #2a3555;border-radius:18px;padding:26px;max-width:420px;width:90%;text-align:center}
.modal-box h2{margin-bottom:8px;font-size:1.2em}
.modal-box p{color:#94a3b8;margin-bottom:12px;font-size:.9em;line-height:1.5}
.form-group{margin:10px 0;text-align:left}
.form-group label{display:block;color:#94a3b8;font-size:.85em;margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;padding:10px;background:#0f1629;border:2px solid #334155;border-radius:10px;color:#fff;font-size:.95em;outline:none;transition:border-color .3s}
.form-group input:focus,.form-group textarea:focus{border-color:#f59e0b}
.form-group textarea{resize:vertical;min-height:60px}
.history-section{margin-top:30px}
.history-title{font-size:1.1em;font-weight:700;color:#94a3b8;margin-bottom:12px;border-top:1px solid #2a3555;padding-top:16px}
.history-item{background:#0f1629;border:1px solid #2a3555;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:.9em}
.history-item .hi-name{font-weight:600;color:#e0e6f0}
.history-item .hi-pts{color:#ef4444;font-weight:600}
.history-item .hi-date{color:#64748b;font-size:.8em}
.success-msg{text-align:center;padding:20px}
.success-msg .big{font-size:3em;margin-bottom:10px}
</style>
</head><body>
<div class="stars"></div><div class="wrap">
  <a href="index.html" class="back" style="color:#f59e0b">← 返回首页</a>
  <header style="position:relative">
    <h1 style="background:linear-gradient(135deg,#f59e0b,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🏪 积分商城</h1>
    <p class="sub">用学习积分兑换精美礼品</p>
    <div class="balance" id="balanceDisplay">⭐ 0 积分</div>
  </header>
  <div id="giftGrid" class="gift-grid"></div>
  <div id="historySection" class="history-section"></div>
</div>
<div class="modal-overlay" id="modal"><div class="modal-box" id="modalContent"></div></div>
<script src="points.js"></script>
<script src="shop.js"></script>
</body></html>
